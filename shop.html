    <style>
        .shop-container {
            max-width: 1200px;

/* Cat Silhouette Search Bar (Color-Matched to Yaeneko) */
.search-container {
    max-width: 440px;
    margin: 22px auto 26px auto;
    display: flex;
    align-items: center;
    background: #fffaf3;
    border: 2px solid #c2a38a;
    border-radius: 999px;
    padding: 6px 8px 6px 18px;
    position: relative;
    box-shadow: 0 6px 14px rgba(140, 112, 100, 0.12);
    transition: all 0.25s ease;
}

/* Tiny Kitty Ears on top of the search bar */
.search-container::before,
.search-container::after {
    content: '';
    position: absolute;
    top: -17px;
    width: 0;
    height: 0;
    border-left: 7px solid transparent;
    border-right: 7px solid transparent;
    border-bottom: 18px solid #fffaf3;
    z-index: 1;
}

.search-container::before {
    left: 28px;
    transform: rotate(-12deg);
}

.search-container::after {
    left: 48px;
    transform: rotate(12deg);
}

.search-container:focus-within {
    border-color: #ab9685;
    background: #ffffff;
    box-shadow: 0 8px 20px rgba(140, 112, 100, 0.18);
}

.search-input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    padding: 6px 4px;
    font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
    font-size: 0.95rem;
    color: #5c4d4c;
    z-index: 2;
}

.search-input::placeholder {
    color: #bfaea2;
}

.search-btn {
    background: #ab9685;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #fffaf3;
    flex-shrink: 0;
    z-index: 2;
    transition: transform 0.2s ease, background-color 0.2s ease;
}

.search-btn:hover {
    background-color: #97826f;
    transform: scale(1.08) rotate(5deg);
}

.search-btn svg {
    width: 16px;
    height: 16px;
}
        /* Cozy Scrapbook Grid — mobile-first */
        .pinterest-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px 16px;
            padding-top: 6px;
        }

        @media (min-width: 600px) {
            .pinterest-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 26px 20px;
            }
        }

        @media (min-width: 900px) {
            .pinterest-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 26px 20px;
            }
        }

        /* Cute Scrapbook Pin Card */
        .pin-card {
            background: #fffaf3;
            border-radius: 26px 12px 26px 12px;
            overflow: visible;
            box-shadow: 0 8px 18px rgba(140, 112, 100, 0.14);
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            padding: 7px 7px 0 7px;
            transform: rotate(-1.5deg);
        }

        .pin-card:nth-child(3n) {
            border-radius: 12px 26px 12px 26px;
            transform: rotate(1.5deg);
        }

        .pin-card:nth-child(3n+1) {
            transform: rotate(-1deg);
        }

        .pin-card:hover,
        .pin-card:active {
            transform: rotate(0deg) translateY(-4px) scale(1.02);
            box-shadow: 0 14px 24px rgba(140, 112, 100, 0.2);
        }

        /* Washi tape accent */
        .pin-card::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(-4deg);
            width: 46px;
            height: 16px;
            background: rgba(194, 163, 138, 0.55);
            border-radius: 3px;
            box-shadow: 0 1px 2px rgba(92, 77, 76, 0.15);
        }

        .pin-card:nth-child(3n)::before {
            transform: translateX(-50%) rotate(4deg);
            background: rgba(233, 200, 178, 0.65);
        }

        .pin-img-wrapper {
            width: 100%;
            aspect-ratio: 4 / 5;
            position: relative;
            z-index: 1;
            background-color: #f7efe3;
            border-radius: 20px 8px 20px 8px;
        }

        .pin-card:nth-child(3n) .pin-img-wrapper {
            border-radius: 8px 20px 8px 20px;
        }

        .pin-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 20px 8px 20px 8px;
            transition: transform 0.4s ease;
        }

        .pin-card:nth-child(3n) img {
            border-radius: 8px 20px 8px 20px;
        }

        .pin-card:hover img {
            transform: scale(1.05);
        }

        /* Sticker-style price badge */
        .pin-price-badge {
            position: absolute;
            bottom: -10px;
            right: -8px;
            background: #ab9685;
            color: #fffaf3;
            font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
            font-weight: 600;
            font-size: 0.72rem;
            padding: 5px 10px;
            border-radius: 999px;
            box-shadow: 0 3px 8px rgba(92, 77, 76, 0.25);
            transform: rotate(-6deg);
            white-space: nowrap;
            z-index: 2;
        }

        .pin-info {
            padding: 12px 4px 16px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
			gap: 2px;
            text-align: center;
        }

        .pin-title {
            font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #5c4d4c;
            margin: 0;
        }

        /* Product Pop-up Modal Styling */
       .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(6px);
    display: flex; /* Always flex to support smooth transition */
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
    opacity: 0;
    pointer-events: none; /* Prevents clicks while hidden */
    transition: opacity 0.3s ease;
}

        .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

       .modal-card {
    background: #ffffff;
    border-radius: 28px;
    max-width: 480px;
    width: 100%;
    padding: 24px;
    position: relative;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    
    /* Animation initial state (shifted up off-screen) */
    transform: translateY(-80px);
    transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}

    .modal-overlay.active .modal-card {
    /* End position: slides down to its normal place */
    transform: translateY(0);
}

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            border: none;
            background: #f7efe3;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            color: #5c4d4c;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

    .modal-main-img {
       width: 100%;
       height: auto;
       max-height: 400px;
       object-fit: contain;
       border-radius: 20px;
       background-color: #f7efe3;
}

        .modal-thumbnails {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }

        .modal-thumb.active, .modal-thumb:hover {
            border-color: #5c4d4c;
            transform: scale(1.05);
        }

        .modal-details {
            text-align: center;
        }

        .modal-title {

            color: #5c4d4c;

            margin: 0 0 16px 0;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .btn-buy, .btn-basket {

			min-width: 120px;
			height: 38px;

}

        /* =================================================================
           CATEGORY CHIP FILTER — a horizontally-scrolling row of "stitched"
           fabric-tag chips, cozy-craft take on the usual e-commerce filter
           row. Tapping a chip filters instantly (no page reload).
           ================================================================= */
        .chip-filter-wrapper {
            margin: 0 -16px 6px -16px;
            padding: 0 16px;
            overflow: visible;
        }

        .chip-filter-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 12px 2px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .chip-filter-row::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex: 0 0 auto;
            font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            color: #8c7568;
            background: #fffaf3;
            border: 1.5px dashed #c2a38a; /* little stitched-edge touch */
            border-radius: 999px;
            padding: 9px 18px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(140, 112, 100, 0.1);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-color 0.2s ease,
                        color 0.2s ease,
                        border-color 0.2s ease,
                        box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-chip:active {
            transform: scale(0.94);
        }

        .filter-chip.active {
            background: #ab9685;
            border-style: solid;
            border-color: #ab9685;
            color: #fffaf3;
            box-shadow: 0 6px 14px rgba(140, 112, 100, 0.28);
            transform: translateY(-2px);
        }

        /* Sort row — small clay-style dropdown button, sits under the chips */
        .sort-row {
            display: flex;
            justify-content: flex-end;
            position: relative;
            margin: 0 0 20px 0;
        }

        .sort-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: #5c4d4c;
            background: #f7efe3;
            border: none;
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            box-shadow:
                0 3px 8px rgba(115, 94, 89, 0.1),
                inset -2px -2px 4px rgba(184, 161, 149, 0.3),
                inset 2px 2px 4px rgba(255, 255, 255, 0.9);
            transition: transform 0.2s ease;
        }

        .sort-btn:active {
            transform: scale(0.96);
        }

        .sort-btn svg {
            width: 14px;
            height: 14px;
            transition: transform 0.25s ease;
        }

        .sort-btn.open svg {
            transform: rotate(180deg);
        }

        .sort-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #fffaf3;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(140, 112, 100, 0.22);
            padding: 6px;
            min-width: 190px;
            z-index: 20;
            opacity: 0;
            transform: translateY(-8px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .sort-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .sort-option {
            display: block;
            width: 100%;
            text-align: left;
            font-family: 'Comfortaa', sans-serif;
            font-size: 0.85rem;
            color: #5c4d4c;
            background: none;
            border: none;
            border-radius: 12px;
            padding: 9px 12px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .sort-option:hover,
        .sort-option:active {
            background: #f2e4d3;
        }

        .sort-option.active {
            color: #ab9685;
            font-weight: 700;
        }

        .results-count {
            font-family: 'Comfortaa', sans-serif;
            font-size: 0.78rem;
            color: #a9968a;
            margin: -10px 0 16px 2px;
        }

        .empty-state {
            text-align: center;
            font-family: 'Comfortaa', sans-serif;
            color: #8c7568;
            padding: 40px 20px;
        }
		
		/* =========================================================================
   COZY AESTHETIC PRELOADER
   ========================================================================= */
#cozyPreloader {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background-color: #F2E8D9; /* Matching Yaeneko warm base background */
    background-image:
        radial-gradient(circle at 50% 40%, rgba(232, 217, 192, 0.7) 0%, transparent 50%),
        radial-gradient(circle at 5% 90%, rgba(201, 151, 63, 0.35) 0%, transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    opacity: 1;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}

#cozyPreloader.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.preloader-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

.yarn-spinner {
    width: 80px;
    height: 80px;
    background: #fffaf3;
    border: 3px solid #c2a38a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 20px rgba(140, 112, 100, 0.18);
    animation: gentlePulse 1.8s ease-in-out infinite;
}

.yarn-ball {
    font-size: 2.2rem;
    animation: yarnRotate 2s linear infinite;
}

.preloader-text {
    font-family: 'Fredoka', 'Comfortaa', cursive, sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #5c4d4c;
    letter-spacing: 0.5px;
}

@keyframes yarnRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

@keyframes gentlePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}
    </style>
</head>

    <script>

// =====================================================================
// PRODUCTS LIST — add, remove, or edit products here. Nothing else in
// this file needs to change.
//
// Each product looks like this:
//   { title: "Product Name", price: "BDT00", images: ["photo1.jpg", "photo2.jpg"] }
//
// - "images" is a simple list of image filenames.
// - The FIRST image is used as the product's thumbnail on the shop page.
// - Any extra images after the first will appear as extra photos when a
//   shopper clicks the product (great for showing different angles).
// =====================================================================
// "category" must be one of the exact names used on the homepage wheel:
// Plushies, Keychains, Hair Accessories, Figurines, Flowers, Sanrio, Clips, Cat collars
// (I've guessed a category for each existing product below based on the
// name alone — please skim through and fix any that are wrong!)
const PRODUCTS = [
    { title: "Spiderman", price: "BDT 25", category: "Figurines", images: ["Spiderman.jpg", "Spiderman1.jpg", "Spiderman2.jpg", "Spiderman3.jpg"] },
    { title: "Bow Hair Clip", price: "BDT 28", category: "Clips", images: ["Clip.jpg", "Clip1.jpg", "Clip2.jpg"] },
    { title: "Sunflower", price: "BDT 22", category: "Flowers", images: ["Sunflower.jpg", "Sunflower1.jpg"] },
    { title: "Batkid", price: "BDT 30", category: "Figurines", images: ["Batkid.jpg", "Batkid1.jpg", "Batkid2.jpg", "Batkid3.jpg"] },
    { title: "Puff", price: "BDT 26", category: "Keychains", images: ["Puff.jpg", "Puff1.jpg", "Puff2.jpg"] },

    // --- Copy the line below to add a new product ---
    { title: "Patrik", price: "BDT 30", category: "Figurines", images: ["Patrik.jpg", "Patrik1.jpg", "Patrik2.jpg", "Patrik3.jpg"] },
    { title: "Totoro", price: "BDT 300", category: "Plushies", images: ["Totoro.jpg", "Totoro1.jpg","Totoro2.jpg",] },
    { title: "FROGGY", price: "BDT 200", category: "Plushies", images: ["FROGGY.jpg", "FROGGY1.jpg","FROGGY2.jpg","FROGGY3.jpg",] },
    { title: "Bouquet", price: "BDT 500", category: "Flowers", images: ["Bouquet.jpg", "Bouquet1.jpg", "Bouquet2.jpg"] },
    { title: "Teddy", price: "BDT 500", category: "Plushies", images: ["Teddy.jpg", "Teddy1.jpg", "Teddy2.jpg"] },
    { title: "Angry hair clip", price: "BDT 100", category: "Clips", images: ["Angry hair clip.jpg", "Angry hair clip1.jpg","Angry hair clip2.jpg",] },
    { title: "Black Rose", price: "BDT 200", category: "Flowers", images: ["Black Rose.jpg", "Black Rose1.jpg","Black Rose2.jpg"] },
    { title: "Battulip", price: "BDT 500", category: "Flowers", images: ["Battulip.jpg", "Battulip1.jpg","Battulip2.jpg"] },
    { title: "Froggy jr", price: "BDT 900", category: "Plushies", images: ["Froggy jr.jpg"] },
    { title: "Beanie", price: "BDT 200", category: "Hair Accessories", images: ["Beanie.jpg", "Beanie1.jpg"] },
    { title: "Takiyakis", price: "BDT 500", category: "Keychains", images: ["Takiyakis.jpg", "Takiyakis1.jpg"] },
    { title: "Strawberries", price: "BDT 500", category: "Keychains", images: ["Strawberries.jpg", "Strawberries1.jpg"] },
	
];

// Builds all the product cards on the shop page from the PRODUCTS list above.
// (Built with plain DOM methods so image filenames or titles never need any
// special escaping — just edit the PRODUCTS list, nothing else.)
// Reads ?category=... from the URL so a wheel tap on the homepage can
// land here already filtered down to just that category.
function getCategoryFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get('category');
}

// ---- Filter / sort state -------------------------------------------------
// Starts from whatever ?category= arrived with (e.g. a homepage wheel tap),
// then chip taps take over from here on — no more page reloads needed.
let activeCategory = getCategoryFromURL() || 'all';
let activeSort = 'featured';

const CATEGORY_ORDER = ["Plushies", "Keychains", "Hair Accessories", "Figurines", "Flowers", "Sanrio", "Clips", "Cat collars"];

// Builds the "All" + one chip per category that actually has products,
// in the same order as the homepage wheel so it feels consistent.
function buildChips() {
    const row = document.getElementById('chipFilterRow');
    const present = new Set(PRODUCTS.map(p => p.category));
    const categories = CATEGORY_ORDER.filter(c => present.has(c));

    row.innerHTML = '';

    const allChip = document.createElement('button');
    allChip.className = 'filter-chip' + (activeCategory === 'all' ? ' active' : '');
    allChip.textContent = 'All';
    allChip.dataset.category = 'all';
    row.appendChild(allChip);

    categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = 'filter-chip' + (activeCategory === cat ? ' active' : '');
        chip.textContent = cat;
        chip.dataset.category = cat;
        row.appendChild(chip);
    });

    row.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            activeCategory = chip.dataset.category;

            // Keep the URL in sync (shareable / back-button friendly)
            // without a full page reload.
            const url = new URL(window.location.href);
            if (activeCategory === 'all') {
                url.searchParams.delete('category');
            } else {
                url.searchParams.set('category', activeCategory);
            }
            history.replaceState(null, '', url);

            row.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');

            // Gently scroll the tapped chip into view on small screens.
            chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

            renderProducts();
        });
    });
}

const SORT_LABELS = {
    'featured': 'Sort: Featured',
    'price-asc': 'Sort: Price ↑',
    'price-desc': 'Sort: Price ↓',
    'name-asc': 'Sort: Name A–Z'
};

function sortProducts(list) {
    const sorted = [...list];
    const priceOf = p => parseFloat(String(p.price).replace(/[^0-9.]+/g, '')) || 0;

    if (activeSort === 'price-asc') sorted.sort((a, b) => priceOf(a) - priceOf(b));
    else if (activeSort === 'price-desc') sorted.sort((a, b) => priceOf(b) - priceOf(a));
    else if (activeSort === 'name-asc') sorted.sort((a, b) => a.title.localeCompare(b.title));
    // 'featured' = leave in the original PRODUCTS order

    return sorted;
}

function initSortDropdown() {
    const sortBtn = document.getElementById('sortBtn');
    const dropdown = document.getElementById('sortDropdown');
    const sortLabel = document.getElementById('sortLabel');

    sortBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
        sortBtn.classList.toggle('open');
    });

    dropdown.querySelectorAll('.sort-option').forEach(opt => {
        opt.addEventListener('click', () => {
            activeSort = opt.dataset.sort;
            sortLabel.textContent = SORT_LABELS[activeSort];

            dropdown.querySelectorAll('.sort-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');

            dropdown.classList.remove('open');
            sortBtn.classList.remove('open');

            renderProducts();
        });
    });

    // Close the dropdown when tapping anywhere else on the page.
    document.addEventListener('click', () => {
        dropdown.classList.remove('open');
        sortBtn.classList.remove('open');
    });
}

function renderProducts() {
    const grid = document.getElementById('productGrid');
    const emptyState = document.getElementById('emptyState');
    const resultsCount = document.getElementById('resultsCount');
    
    // Read search input value
    const searchQuery = document.getElementById('searchInput') 
        ? document.getElementById('searchInput').value.toLowerCase().trim() 
        : '';

    grid.innerHTML = '';

    // Filter by both Category and Search Query
    let productsToShow = PRODUCTS.filter(p => {
        const matchesCategory = activeCategory === 'all' ? true : p.category === activeCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
    });

    productsToShow = sortProducts(productsToShow);

    emptyState.style.display = productsToShow.length === 0 ? 'block' : 'none';

    if (resultsCount) {
        resultsCount.textContent = productsToShow.length === 0
            ? ''
            : `${productsToShow.length} creation${productsToShow.length === 1 ? '' : 's'}`;
    }

    productsToShow.forEach(product => {
        const card = document.createElement('div');
        card.className = 'pin-card';
        card.onclick = () => openProductModal(product.title, product.price, product.images);

        card.innerHTML = `
            <div class="pin-img-wrapper">
                <img src="${product.images[0]}" alt="${product.title}">
                <span class="pin-price-badge">${product.price}</span>
            </div>
            <div class="pin-info">
                <h3 class="pin-title">${product.title}</h3>
            </div>
        `;

        grid.appendChild(card);
    });
}

buildChips();
initSortDropdown();
renderProducts();

// Holds the product currently shown in the pop-up so the Buy Now /
// Add to Basket buttons know exactly what to save to the cart.
let currentProduct = null;

function openProductModal(title, price, imageList) {
    currentProduct = { title, price, images: imageList };

    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalPrice').textContent = price;
    
    const mainImg = document.getElementById('modalMainImg');
    mainImg.src = imageList[0];

    const thumbContainer = document.getElementById('modalThumbnails');
    thumbContainer.innerHTML = '';

    imageList.forEach((imgSrc, index) => {
        const thumb = document.createElement('img');
        thumb.src = imgSrc;
        thumb.className = `modal-thumb ${index === 0 ? 'active' : ''}`;
        thumb.onclick = function() {
            mainImg.src = imgSrc;
            document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        };
        thumbContainer.appendChild(thumb);
    });

    // Show modal with animation
    document.getElementById('productModal').classList.add('active');
    document.body.style.overflow = 'hidden'; // Prevent body scroll
}

// ADD TO BASKET — saves the currently open product to the cart (localStorage)
document.getElementById('modalAddToCart').addEventListener('click', () => {
    if (!currentProduct) return;
    addToCart(currentProduct);

    const btn = document.getElementById('modalAddToCart');
    const original = btn.textContent;
    btn.textContent = 'Added ✓';
    setTimeout(() => { btn.textContent = original; }, 1200);
});

// BUY NOW — saves the product to the cart, then jumps straight to checkout
document.getElementById('modalBuyNow').addEventListener('click', () => {
    if (!currentProduct) return;
    addToCart(currentProduct);
    window.location.href = 'cart.html';
});

function closeProductModal() {
    document.getElementById('productModal').classList.remove('active');
    document.body.style.overflow = ''; // Restore body scroll
}

function closeModalOnOverlay(e) {
    if (e.target.id === 'productModal') {
        closeProductModal();
    }
}

// Hide preloader smoothly after the page and all product images are fully loaded
window.addEventListener('load', () => {
    const preloader = document.getElementById('cozyPreloader');
    if (preloader) {
        preloader.classList.add('fade-out');
    }
});
    </script>
